# Project metadata + tooling config.
#
# Runtime dependencies are pinned in `requirements.txt` (installed by `make setup`);
# they are intentionally not duplicated here. This file configures tooling only.

[project]
name = "ibm-data-analyst-capstone"
version = "1.0.0"
description = "Reproducible analysis of the Stack Overflow 2024 Developer Survey (ETL -> SQLite -> report)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Malik Awais" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
